<!doctype html>
<!-- GitHub Pages serves this file for any missing path, at any depth, so
     every URL here stays root-absolute under /ubifit/. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · UbiFit</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/ubifit/assets/logo-icon.png">

  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var stored = localStorage.getItem("ubiring-theme-v2");
        var theme = stored === "light" || stored === "dark" ? stored : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/ubifit/assets/site.css">
  <script defer src="/ubifit/assets/site.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header" data-header>
    <div class="wrap site-header__row">
      <a class="brand" href="/ubifit/">
        <img src="/ubifit/assets/logo-icon.png" alt="" width="30" height="30">
        <span>UbiFit</span>
      </a>
      <nav class="site-nav" aria-label="Documents">
        <a href="/ubifit/privacy/">Privacy</a>
        <a href="/ubifit/terms/">Terms</a>
        <a href="/ubifit/support/">Support</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
        <span class="theme-toggle__icon" aria-hidden="true">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </span>
      </button>
    </div>
  </header>

  <main>
    <div class="wrap notfound">
      <p class="notfound__code settle" style="--i:0">404</p>
      <h1 class="doc-hero__title settle" style="--i:1">Page not found</h1>
      <p class="doc-hero__lede settle" style="--i:2">That address does not match anything here. The three UbiFit documents are below.</p>
      <div class="notfound__links settle" style="--i:3">
        <a class="btn" href="/ubifit/">UbiFit home</a>
        <a class="btn btn--ghost" href="/ubifit/privacy/">Privacy Policy</a>
        <a class="btn btn--ghost" href="/ubifit/terms/">Terms of Use</a>
        <a class="btn btn--ghost" href="/ubifit/support/">Support</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="site-footer__bottom site-footer__bottom--bare">
        <span>© 2026 Ubitrix Intl Inc</span>
        <span><a href="mailto:info@ubitrix.com">info@ubitrix.com</a></span>
      </div>
    </div>
  </footer>
</body>
</html>
